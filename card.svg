<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 810" role="img" aria-labelledby="title desc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
